name: Portfolio Risk generic operational shadow

on:
  pull_request:
  workflow_dispatch:

jobs:
  generic-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m scripts.run_portfolio_risk_generic_operational_shadow --output-dir artifacts/portfolio_risk_generic_operational_shadow
      - run: python -m unittest tests.test_portfolio_risk -v
