name: SETUP01 D1 GCS Storage Validation

on:
  workflow_dispatch:
    inputs:
      expected_bucket_identity_sha256:
        description: "SHA-256 of gs://<project>/<dedicated-bucket>"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      D1_RESEARCH_GCS_BUCKET: ${{ secrets.D1_RESEARCH_GCS_BUCKET }}
      D1_RESEARCH_GCS_PROJECT: ${{ secrets.D1_RESEARCH_GCS_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate dedicated GCS bucket and synthetic object
        env:
          EXPECTED_BUCKET_IDENTITY_SHA256: ${{ inputs.expected_bucket_identity_sha256 }}
        run: >-
          python scripts/run_setup01_d1_collector.py gcs-validate-storage
          --expected-bucket-identity-sha256 "$EXPECTED_BUCKET_IDENTITY_SHA256"
