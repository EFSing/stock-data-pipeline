name: 亚洲市场收盘更新

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode (full is manual-only)"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - full
  schedule:
    # 北京时间17:30，给收盘后更新较慢的免费数据源预留同步时间。
    - cron: "30 9 * * 1-5"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run production market data pipeline
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            RUN_MODE=latest
          else
            RUN_MODE="${DISPATCH_MODE:-latest}"
          fi
          python main.py --group asia --mode "$RUN_MODE" | tee run-summary.txt
          if [ "$RUN_MODE" = "latest" ]; then
            python scripts/refresh_production_qfq.py --group asia | tee -a run-summary.txt
          fi
      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## Production market data summary"
            if [ -f run-summary.txt ]; then cat run-summary.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"
