name: 亚洲市场收盘更新

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode (cloud-smoke is temporary manual-only)"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - full
          - cloud-smoke
      trade_date:
        description: "Optional exact completed CN session date (YYYY-MM-DD; cloud-smoke only)"
        required: false
        default: ""
        type: string
  schedule:
    # 北京时间17:30，给收盘后更新较慢的免费数据源预留同步时间。
    - cron: "30 9 * * 1-5"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run production market data pipeline
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'cloud-smoke' }}
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            RUN_MODE=latest
          else
            RUN_MODE="${DISPATCH_MODE:-latest}"
          fi
          python main.py --group asia --mode "$RUN_MODE" | tee run-summary.txt
          main_status=${PIPESTATUS[0]}
          if [ "$main_status" -ne 0 ]; then
            exit "$main_status"
          fi
          if [ "$RUN_MODE" = "latest" ]; then
            python scripts/refresh_production_qfq.py --group asia | tee -a run-summary.txt
          fi
      - name: Run CN cloud daily report smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'cloud-smoke' }}
        env:
          REPORT_DATE: ${{ inputs.trade_date }}
          BARK_ENDPOINT: ${{ secrets.BARK_ENDPOINT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/cloud-daily-report/CN"
          mkdir -p "$report_dir"
          args=(--market CN --output "$report_dir")
          if [ -n "${REPORT_DATE:-}" ]; then args+=(--date "$REPORT_DATE"); fi
          python scripts/run_cloud_daily_report.py "${args[@]}" | tee cloud-smoke-summary.txt
      - name: Upload CN cloud smoke artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'cloud-smoke' }}
        uses: actions/upload-artifact@v4
        with:
          name: cn-cloud-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cloud-daily-report/CN/daily-report.json
            ${{ runner.temp }}/cloud-daily-report/CN/daily-report.html
          if-no-files-found: error
          retention-days: 1
      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## Production market data summary"
            if [ -f run-summary.txt ]; then cat run-summary.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"
