name: SETUP01 D1 VPS Activation Record

# Manual only.  Creates one immutable per-market activation record that binds
# the frozen D1 protocol, the VPS backend/storage identity, the source/observer
# contract and the current main code SHA.  The natural collector refuses to run
# before this record exists, and the record is never rewritten afterwards.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to activate independently"
        required: true
        type: choice
        options:
          - CN
          - US
      source_contract_version:
        description: "Immutable source contract epoch to activate"
        required: true
        type: choice
        options:
          - SETUP01_D1_SOURCE_OBSERVER_CONTRACT_V1
          - SETUP01_D1_SINGLE_SOURCE_CONTRACT_V2

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      D1_VPS_HOST: ${{ secrets.D1_VPS_HOST }}
      D1_VPS_PORT: ${{ vars.D1_VPS_PORT }}
      D1_VPS_USER: ${{ vars.D1_VPS_USER }}
      D1_VPS_STORAGE_ROOT: ${{ vars.D1_VPS_STORAGE_ROOT }}
      D1_VPS_SSH_PRIVATE_KEY: ${{ secrets.D1_VPS_SSH_PRIVATE_KEY }}
      D1_VPS_KNOWN_HOSTS: ${{ secrets.D1_VPS_KNOWN_HOSTS }}
      D1_VPS_HOST_KEY_FINGERPRINT: ${{ secrets.D1_VPS_HOST_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Create immutable activation record
        run: >-
          python scripts/run_setup01_d1_collector.py vps-create-activation
          --market "${{ inputs.market }}"
          --activation-timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          --code-sha "$GITHUB_SHA"
          --source-contract-version "${{ inputs.source_contract_version }}"
