name: CI Test Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_setup03_replay:
        description: "Run read-only SETUP_03 historical replay"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  setup03-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.run_setup03_replay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run read-only SETUP_03 replay
        run: python scripts/run_setup03_replay.py
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - uses: actions/upload-artifact@v4
        with:
          name: setup03-replay
          path: artifacts/setup03_replay/
