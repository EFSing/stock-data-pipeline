name: SETUP01 Market Close Reconciliation (US)

# Primary US trigger.  The cron fires at 09:40 Beijing (Tue-Sat), after the
# prior exchange session close in both US DST and standard-time schedules and
# after the 08:30 Beijing production market-data run.  The shared
# reconciliation resolver selects the latest real completed session, enforces
# the close-to-next-open prospective window, and makes duplicate triggers
# idempotent.  Cloudflare and VPS watchdogs dispatch this same workflow.
on:
  schedule:
    - cron: "40 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup01-d1-vps-natural-collector-us
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      D1_VPS_HOST: ${{ secrets.D1_VPS_HOST }}
      D1_VPS_PORT: ${{ vars.D1_VPS_PORT }}
      D1_VPS_USER: ${{ vars.D1_VPS_USER }}
      D1_VPS_STORAGE_ROOT: ${{ vars.D1_VPS_STORAGE_ROOT }}
      D1_VPS_SSH_PRIVATE_KEY: ${{ secrets.D1_VPS_SSH_PRIVATE_KEY }}
      D1_VPS_KNOWN_HOSTS: ${{ secrets.D1_VPS_KNOWN_HOSTS }}
      D1_VPS_HOST_KEY_FINGERPRINT: ${{ secrets.D1_VPS_HOST_KEY_FINGERPRINT }}
      D1_VPS_MIN_FREE_BYTES: ${{ vars.D1_VPS_MIN_FREE_BYTES }}
      D1_VPS_DANGER_FREE_BYTES: ${{ vars.D1_VPS_DANGER_FREE_BYTES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Reconcile US market close
        run: >
          python scripts/run_market_close_reconcile.py
          --market US
          --output "$RUNNER_TEMP/d1-collector-receipt.json"
          --report-output "$RUNNER_TEMP/d1-research-report.md"
      - name: Upload non-authoritative receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup01-d1-vps-US-collector-receipt
          path: |
            ${{ runner.temp }}/d1-collector-receipt.json
            ${{ runner.temp }}/d1-research-report.md
