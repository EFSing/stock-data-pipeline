name: SETUP01 D1 CN Research Collection

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Diagnostic date (YYYY-MM-DD); never prospective evidence"
        required: true
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      REPORT_DATE: ${{ inputs.trade_date }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      D1_RESEARCH_DRIVE_FOLDER_ID: ${{ secrets.D1_RESEARCH_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify folder-scoped durable storage
        run: python scripts/run_setup01_d1_collector.py drive-access-check --write-readback-probe
      - name: Generate independent CN observation source
        run: |
          python scripts/run_cloud_daily_report.py --market CN --date "$REPORT_DATE" --output "$RUNNER_TEMP/d1-source/CN" --no-notify || true
          test -f "$RUNNER_TEMP/d1-source/CN/daily-report.json"
      - name: Commit diagnostic CN report projection
        run: |
          mkdir -p "$RUNNER_TEMP/d1-output/CN"
          python scripts/run_setup01_d1_collector.py drive-collect-daily-report \
            --daily-report "$RUNNER_TEMP/d1-source/CN/daily-report.json" \
            --report-output "$RUNNER_TEMP/d1-output/CN/research-observation.md" \
            --diagnostic-backfill | tee "$RUNNER_TEMP/d1-output/CN/storage-receipt.json"
      - name: Verify durable CN/US object graph
        run: python scripts/run_setup01_d1_collector.py drive-verify
      - name: Upload non-authoritative observation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup01-d1-cn-research-observation
          path: ${{ runner.temp }}/d1-output/CN
          if-no-files-found: warn
          retention-days: 30
