name: US Daily Report

on:
  schedule:
    # 美股交易日后的北京时间 09:00（次日 UTC 01:00，周二至周六）。
    - cron: "0 1 * * 2-6"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional completed US session date (YYYY-MM-DD)"
        required: false
        type: string
      require_complete:
        description: "Strict audit: fail even when a partial report was delivered"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: us-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    env:
      VALIDATION_MARKET: US
      REPORT_DATE: ${{ inputs.trade_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate US report with public fixture and real provider
        run: python _candidate_asof_live_validation.py
      - name: Upload final US artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-daily-report
          path: |
            ${{ runner.temp }}/cloud-daily-report/US/daily-report.json
            ${{ runner.temp }}/cloud-daily-report/US/daily-report.html
            ${{ runner.temp }}/cloud-daily-report/US/validation-summary.json
          if-no-files-found: error
          retention-days: 7

