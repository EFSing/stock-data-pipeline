name: CN Daily Report

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional completed CN session date (YYYY-MM-DD)"
        required: false
        type: string
      require_complete:
        description: "Strict audit: fail even when a partial report was delivered"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cn-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    env:
      VALIDATION_MARKET: CN
      REPORT_DATE: ${{ inputs.trade_date }}
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate CN report with public fixture and real provider
        run: python _candidate_asof_live_validation.py
      - name: Upload final CN artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-daily-report
          path: |
            ${{ runner.temp }}/cloud-daily-report/CN/daily-report.json
            ${{ runner.temp }}/cloud-daily-report/CN/daily-report.html
            ${{ runner.temp }}/cloud-daily-report/CN/validation-summary.json
          if-no-files-found: error
          retention-days: 7

