name: Holdings command bus

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: holdings-command-live-writes
  cancel-in-progress: false

jobs:
  command:
    if: >-
      github.event.repository.full_name == 'EFSing/stock-data-pipeline' &&
      github.event.issue.pull_request == null &&
      github.actor == 'EFSing' &&
      github.event.sender.login == 'EFSing' &&
      github.event.issue.user.login == 'EFSing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate and route holdings command
        id: route
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: >-
          python -m scripts.holdings_command_bridge
          --event-path "$GITHUB_EVENT_PATH"
          --route-path "$GITHUB_OUTPUT"
      - name: Execute dry-run or fail closed
        if: steps.route.outputs.command_route != 'live'
        env:
          HOLDINGS_COMMAND_BUS_LIVE_WRITES: disabled
        run: >-
          python -m scripts.holdings_command_bridge
          --event-path "$GITHUB_EVENT_PATH"
          --result-path holdings-command-result.json
          --comment-path holdings-command-result.md
      - name: Execute approved live command
        if: steps.route.outputs.command_route == 'live'
        env:
          HOLDINGS_COMMAND_BUS_LIVE_WRITES: enabled
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: >-
          python -m scripts.holdings_command_bridge
          --event-path "$GITHUB_EVENT_PATH"
          --result-path holdings-command-result.json
          --comment-path holdings-command-result.md
      - name: Comment result and close command issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('holdings-command-result.json') || !fs.existsSync('holdings-command-result.md')) {
              core.setFailed('command bridge did not produce a result receipt');
              return;
            }
            const result = JSON.parse(fs.readFileSync('holdings-command-result.json', 'utf8'));
            const comment = fs.readFileSync('holdings-command-result.md', 'utf8');
            const issue_number = context.payload.issue.number;
            const labels = result.status === 'FAILED'
              ? ['holdings-command:failed']
              : ['holdings-command:success'];
            if (result.dry_run === true) labels.push('holdings-command:dry-run');
            const errors = [];
            let commentPosted = false;
            try {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number, body: comment});
              commentPosted = true;
            } catch (error) {
              errors.push('result comment failed');
            }
            if (commentPosted) {
              for (const name of labels) {
                try {
                  await github.rest.issues.getLabel({owner: context.repo.owner, repo: context.repo.repo, name});
                } catch (error) {
                  if (error.status !== 404) { errors.push('result label lookup failed'); continue; }
                  try {
                    await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, name, color: name.endsWith('failed') ? 'b60205' : '0e8a16'});
                  } catch (createError) {
                    errors.push('result label creation failed');
                  }
                }
              }
              try {
                await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number, labels});
              } catch (error) {
                errors.push('result label write failed');
              }
              try {
                await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number, state: 'closed'});
              } catch (error) {
                errors.push('issue close failed');
              }
            }
            if (errors.length) core.setFailed(errors.join('; '));
