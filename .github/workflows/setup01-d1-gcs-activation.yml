name: "[DISABLED] SETUP01 D1 GCS Activation Record"

# DISABLED / NON-PRODUCTION.  The approved SETUP_01 D1 durable backend is
# SETUP01_D1_VPS_SSH_DURABLE_STORAGE (see docs/DECISION_LOG.md).  Re-enabling
# requires a recorded decision plus the D1_GCS_BACKEND_ENABLED repository
# variable and D1_GCS_BACKEND_APPROVED_FOR_FORMAL_D1 in the runtime.

# Manual only.  Creates one immutable per-market activation record that binds
# the frozen D1 protocol, the dedicated bucket identity, the source/observer
# contract and the current main code SHA.  The natural collector refuses to run
# before this record exists, and the record is never rewritten afterwards.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to activate independently"
        required: true
        type: choice
        options:
          - CN
          - US
      source_contract_version:
        description: "Immutable source contract epoch to activate"
        required: true
        type: choice
        options:
          - SETUP01_D1_SOURCE_OBSERVER_CONTRACT_V1
          - SETUP01_D1_SINGLE_SOURCE_CONTRACT_V2

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      D1_RESEARCH_GCS_BUCKET: ${{ secrets.D1_RESEARCH_GCS_BUCKET }}
      D1_RESEARCH_GCS_PROJECT: ${{ secrets.D1_RESEARCH_GCS_PROJECT }}
    steps:
      - name: Confirm D1 backend approval
        if: vars.D1_GCS_BACKEND_ENABLED != 'true'
        run: |
          echo "::error::GCS is not the approved SETUP_01 D1 durable backend. See docs/DECISION_LOG.md."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Create immutable activation record
        run: >-
          python scripts/run_setup01_d1_collector.py gcs-create-activation
          --market "${{ inputs.market }}"
          --activation-timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          --code-sha "$GITHUB_SHA"
          --source-contract-version "${{ inputs.source_contract_version }}"
