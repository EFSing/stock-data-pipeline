name: SETUP01 D1 US Research Collection

on:
  schedule:
    # 独立于生产日报；美股收盘后的北京时间 09:30（周二至周六）。
    - cron: "30 1 * * 2-6"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional diagnostic date (YYYY-MM-DD); never prospective evidence"
        required: false
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      REPORT_DATE: ${{ inputs.trade_date }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      D1_RESEARCH_DRIVE_FOLDER_ID: ${{ secrets.D1_RESEARCH_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify folder-scoped durable storage
        run: python scripts/run_setup01_d1_collector.py drive-access-check --write-readback-probe
      - name: Generate independent US observation source
        run: |
          if [ -n "$REPORT_DATE" ]; then
            python scripts/run_cloud_daily_report.py --market US --date "$REPORT_DATE" --output "$RUNNER_TEMP/d1-source/US" --no-notify || true
          else
            python scripts/run_cloud_daily_report.py --market US --output "$RUNNER_TEMP/d1-source/US" --no-notify || true
          fi
          test -f "$RUNNER_TEMP/d1-source/US/daily-report.json"
      - name: Commit immutable US D1 session
        run: |
          EXTRA_ARGS=()
          if [ -n "$REPORT_DATE" ]; then EXTRA_ARGS+=(--diagnostic-backfill); fi
          python scripts/run_setup01_d1_collector.py drive-collect-daily-report \
            --daily-report "$RUNNER_TEMP/d1-source/US/daily-report.json" \
            --report-output "$RUNNER_TEMP/d1-output/US/research-observation.md" \
            "${EXTRA_ARGS[@]}" | tee "$RUNNER_TEMP/d1-output/US/storage-receipt.json"
      - name: Verify durable CN/US object graph
        run: python scripts/run_setup01_d1_collector.py drive-verify
      - name: Upload non-authoritative observation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup01-d1-us-research-observation
          path: ${{ runner.temp }}/d1-output/US
          if-no-files-found: warn
          retention-days: 30

