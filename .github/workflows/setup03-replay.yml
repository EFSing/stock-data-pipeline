name: SETUP_03 Historical Replay and Research Backtest

on:
  workflow_dispatch:
    inputs:
      frozen_input_run_id:
        description: "Prior run ID; 32826696259 is the fixed Phase 5E dataset"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download prior frozen replay input
        if: inputs.frozen_input_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: setup03-replay
          path: previous-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.frozen_input_run_id }}
      - name: Run read-only SETUP_03 replay and research diagnostics
        shell: bash
        run: |
          if [ -n "$FROZEN_INPUT_RUN_ID" ]; then
            phase5e_args=()
            if [ "$FROZEN_INPUT_RUN_ID" = "32826696259" ]; then
              phase5e_args+=(--phase5e --phase5f --phase5g)
            fi
            python scripts/run_setup03_replay.py \
              --frozen-input previous-artifact/setup03_replay_input.jsonl.gz \
              --compare-manifest previous-artifact/setup03_replay_input_manifest.json \
              "${phase5e_args[@]}"
          else
            python scripts/run_setup03_replay.py
          fi
        env:
          FROZEN_INPUT_RUN_ID: ${{ inputs.frozen_input_run_id }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup03-replay
          path: artifacts/setup03_replay/
