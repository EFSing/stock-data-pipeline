name: SETUP01 D1 VPS Natural Collector (CN)

# Scheduled CN D1 collection.  The cron fires after the 15:00 Beijing close and
# after the 17:30 Beijing production market-data run; the collector itself
# resolves the natural exchange session and refuses pre-activation or
# incomplete sessions.  A durable commit failure never changes or fails the
# production daily report path, and repeated runs are idempotent.
on:
  schedule:
    - cron: "40 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup01-d1-vps-natural-collector-cn
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      D1_VPS_HOST: ${{ secrets.D1_VPS_HOST }}
      D1_VPS_PORT: ${{ vars.D1_VPS_PORT }}
      D1_VPS_USER: ${{ vars.D1_VPS_USER }}
      D1_VPS_STORAGE_ROOT: ${{ vars.D1_VPS_STORAGE_ROOT }}
      D1_VPS_SSH_PRIVATE_KEY: ${{ secrets.D1_VPS_SSH_PRIVATE_KEY }}
      D1_VPS_KNOWN_HOSTS: ${{ secrets.D1_VPS_KNOWN_HOSTS }}
      D1_VPS_HOST_KEY_FINGERPRINT: ${{ secrets.D1_VPS_HOST_KEY_FINGERPRINT }}
      D1_VPS_MIN_FREE_BYTES: ${{ vars.D1_VPS_MIN_FREE_BYTES }}
      D1_VPS_DANGER_FREE_BYTES: ${{ vars.D1_VPS_DANGER_FREE_BYTES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect one natural CN D1 session
        run: >
          python scripts/run_setup01_d1_natural_collector.py
          --backend vps
          --market CN
          --output "$RUNNER_TEMP/d1-collector-receipt.json"
          --report-output "$RUNNER_TEMP/d1-research-report.md"
      - name: Upload non-authoritative receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup01-d1-vps-CN-collector-receipt
          path: |
            ${{ runner.temp }}/d1-collector-receipt.json
            ${{ runner.temp }}/d1-research-report.md
