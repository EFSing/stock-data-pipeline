name: "[DISABLED] SETUP01 D1 Drive Storage Validation"

# DISABLED / HISTORICAL.  The Google Drive folder route returned 404 for the
# configured folder ID and is no longer a D1 backend.  This workflow is kept
# only as the historical synthetic adapter test path.

on:
  workflow_dispatch:
    inputs:
      expected_folder_id_sha256:
        description: "SHA-256 of the user-provided dedicated D1 folder ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      D1_RESEARCH_DRIVE_FOLDER_ID: ${{ secrets.D1_RESEARCH_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate synthetic object in configured research folder
        env:
          EXPECTED_FOLDER_ID_SHA256: ${{ inputs.expected_folder_id_sha256 }}
        run: python scripts/run_setup01_d1_collector.py drive-validate-storage --expected-folder-id-sha256 "$EXPECTED_FOLDER_ID_SHA256"
