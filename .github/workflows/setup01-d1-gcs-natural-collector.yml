name: "[DISABLED] SETUP01 D1 GCS Natural Collector"

# DISABLED / NON-PRODUCTION.  The approved SETUP_01 D1 durable backend is
# SETUP01_D1_VPS_SSH_DURABLE_STORAGE (see docs/DECISION_LOG.md).  The runtime
# additionally refuses any GCS activation/commit without an explicit
# D1_GCS_BACKEND_APPROVED_FOR_FORMAL_D1 approval, so two backends can never
# hold writable formal D1 authority at the same time.

# This workflow is manual until the per-market immutable activation record is
# created.  A future schedule may be added only after activation; the natural
# collector itself refuses pre-activation and diagnostic sessions.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market with an existing immutable activation record"
        required: true
        type: choice
        options:
          - CN
          - US

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      D1_RESEARCH_GCS_BUCKET: ${{ secrets.D1_RESEARCH_GCS_BUCKET }}
      D1_RESEARCH_GCS_PROJECT: ${{ secrets.D1_RESEARCH_GCS_PROJECT }}
    steps:
      - name: Confirm D1 backend approval
        if: vars.D1_GCS_BACKEND_ENABLED != 'true'
        run: |
          echo "::error::GCS is not the approved SETUP_01 D1 durable backend. See docs/DECISION_LOG.md."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect one natural D1 session
        run: >-
          python scripts/run_setup01_d1_natural_collector.py
          --market "${{ inputs.market }}"
          --output "$RUNNER_TEMP/d1-collector-receipt.json"
          --report-output "$RUNNER_TEMP/d1-research-report.md"
      - name: Upload non-authoritative receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup01-d1-${{ inputs.market }}-collector-receipt
          path: |
            ${{ runner.temp }}/d1-collector-receipt.json
            ${{ runner.temp }}/d1-research-report.md
